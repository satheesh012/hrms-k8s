apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

          ports:
            - containerPort: 3306

          volumeMounts:
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init
            
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc